; ATtiny13A programs, flashed in place by the XIAO running 05-isp.
; Build one, then turn its hex into src/attiny_image.h with hex2h.py.

[env]
platform = atmelavr
board = attiny13a
board_build.f_cpu = 9600000L

[env:t1-blink]
build_src_filter = +<t1_blink.c>

[env:t2-modes]
build_src_filter = +<t2_modes.c>
