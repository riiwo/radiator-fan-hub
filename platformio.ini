; One environment per bench program. Each program verifies exactly one thing and
; may only use component code that the previous program proved.

[env]
platform = espressif32
board = seeed_xiao_esp32c3
framework = espidf
monitor_speed = 115200

[env:01-timing]
board_build.cmake_extra_args = -DPROGRAM=01_timing

[env:02-level]
board_build.cmake_extra_args = -DPROGRAM=02_level

[env:04-soak]
board_build.cmake_extra_args = -DPROGRAM=04_soak

[env:05-isp]
board_build.cmake_extra_args = -DPROGRAM=05_isp

[env:06-probes]
board_build.cmake_extra_args = -DPROGRAM=06_probes

[env:controller]
board_build.cmake_extra_args = -DPROGRAM=controller -DSDKCONFIG_DEFAULTS=controller.defaults
board_build.partitions = partitions_ota.csv
board_upload.flash_size = 4MB

[env:hub-test]
board_build.cmake_extra_args = -DPROGRAM=hub_test -DSDKCONFIG_DEFAULTS=controller.defaults
board_build.partitions = partitions_ota.csv
board_upload.flash_size = 4MB

[env:07-colours]
board_build.cmake_extra_args = -DPROGRAM=07_colours

[env:hub-nowifi]
board_build.cmake_extra_args = -DPROGRAM=hub_nowifi -DSDKCONFIG_DEFAULTS=controller.defaults
board_build.partitions = partitions_ota.csv
board_upload.flash_size = 4MB

[env:hub-noisp]
board_build.cmake_extra_args = -DPROGRAM=hub_noisp -DSDKCONFIG_DEFAULTS=controller.defaults
board_build.partitions = partitions_ota.csv
board_upload.flash_size = 4MB

[env:bisect-none]
board_build.cmake_extra_args = -DPROGRAM=hub_bisect
build_flags = -DBISECT_LED=0 -DBISECT_BUTTON=0

[env:bisect-led]
board_build.cmake_extra_args = -DPROGRAM=hub_bisect
build_flags = -DBISECT_LED=1 -DBISECT_BUTTON=0

[env:bisect-button]
board_build.cmake_extra_args = -DPROGRAM=hub_bisect
build_flags = -DBISECT_LED=0 -DBISECT_BUTTON=1

[env:bisect-both]
board_build.cmake_extra_args = -DPROGRAM=hub_bisect
build_flags = -DBISECT_LED=1 -DBISECT_BUTTON=1

[env:10-pins]
board_build.cmake_extra_args = -DPROGRAM=10_pins

[env:08-jig]
board = dfrobot_firebeetle2_esp32e
board_build.cmake_extra_args = -DPROGRAM=08_jig

[env:09-hubjig]
board = dfrobot_firebeetle2_esp32e
board_build.cmake_extra_args = -DPROGRAM=09_hubjig
